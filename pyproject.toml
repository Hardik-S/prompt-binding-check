[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-binding-check"
version = "0.1.0"
description = "Check prompt-template binding coverage without rendering content"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Hardik-S"}]
dependencies = []

[project.scripts]
prompt-binding-check = "prompt_binding_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
